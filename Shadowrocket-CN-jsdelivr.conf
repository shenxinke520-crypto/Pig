[Host]
# 常用国内 DNS 指定，减少一次解析
localhost = 127.0.0.1
# 部分设备 mDNS 问题
*.local = server:system

[URL Rewrite]
# 强制 Google 走国内可访问的域名（如不需要可删）
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
